<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
          <div class="ability-buttons hidden" id="ability-buttons">
            <button class="ability-btn" id="ability-preview-btn" title="Ver las siguientes 5 piezas">👁 Ver 5 (1)</button>
            <button class="ability-btn" id="ability-slow-btn" title="Ralentizar la caída al 60% por 10s">🐢 Lento (2)</button>
          </div>
          <span class="slow-indicator hidden" id="slow-indicator"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>1</kbd><kbd>2</kbd> habilidad</li>
          </ul>
        </div>
      </aside>

      <aside class="panel preview-section hidden" id="preview-section">
        <div class="panel-section">
          <span class="label">SIGUIENTES 5</span>
          <canvas id="preview-canvas" width="80" height="400"></canvas>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
